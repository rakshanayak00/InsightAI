version: '3.8'

services:
  insightai:
    build: .
    container_name: insightai-bi-platform
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./saved_models:/app/saved_models
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
